[project]
name = "agent-analytical-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.106",
    "faker>=40.43.0",
    "fastembed>=0.9.0",
    "mcp>=1.0,<2",
    "mem0ai>=2.2.1",
    "openelectricity>=0.12.0",
    "pyarrow>=26.0.0",
    "pyiceberg[pyarrow,pyiceberg-core,s3fs]>=0.12.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "s3fs>=2026.9.0",
    "spacy>=3.8.16",
    "starlette>=1.7.0",
    "strands-agents>=1.60.0",
    "strands-agents-tools>=0.8.9",
    "uvicorn>=0.54.0",
    "valkey>=6.2.0",
    "wrenai[main,mcp,memory,memory-onnx,trino]>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs `make up` (Valkey) and AWS credentials; run via make test-integration",
]

[tool.ruff]
line-length = 100
target-version = "py312"
