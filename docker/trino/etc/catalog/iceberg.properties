# Trino's Iceberg catalog backed by Lakekeeper (Phase 1).
# The filename IS the catalog name, so SQL addresses tables as
#   iceberg.ecommerce.<table>
# matching the upstream repo and (later) WrenAI's profiles.yml.
#
# No S3 keys here: Trino requests short-term credentials from the catalog
# (vended credentials), and Lakekeeper mints them via the STS vending role
# managed in terraform/iam.tf.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=dev_lakehouse
iceberg.rest-catalog.nested-namespace-enabled=true
iceberg.rest-catalog.vended-credentials-enabled=true
iceberg.unique-table-location=true
fs.native-s3.enabled=true
s3.region=ap-southeast-2
# Property names are version-sensitive: Trino 476 (our pin) uses
# fs.native-s3.enabled; newer releases renamed it to fs.s3.enabled — and
# Lakekeeper's docs snippets assume the newer names. The enable flag also
# gates the s3.* properties, so a wrong flag reports s3.region as "not used"
# as well.
