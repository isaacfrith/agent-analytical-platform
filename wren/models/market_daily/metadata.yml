name: market_daily
table_reference:
  catalog: iceberg
  schema: energy
  table: market_daily
columns:
  - name: day
    type: TIMESTAMP
    is_calculated: false
    not_null: true
    properties:
      description: "Market-local calendar day (midnight): NEM days are AEST (+10), WEM days AWST (+08). 90-day rolling window."
  - name: network_region
    type: VARCHAR
    is_calculated: false
    not_null: true
    properties:
      description: "Market region: NSW1|QLD1|SA1|TAS1|VIC1 (network NEM) or WEM (network WEM, south-west WA)."
  - name: network
    type: VARCHAR
    is_calculated: false
    not_null: true
    properties:
      description: "Market: NEM (east-coast grid, five regions) | WEM (south-west WA, one region). Separate, unconnected markets — filter network = 'NEM' when the user says 'the NEM'."
  - name: price_aud_mwh
    type: DOUBLE
    is_calculated: false
    not_null: false
    properties:
      description: "Volume-weighted average spot price that day, AUD/MWh. A rate — average it, never sum it. Can go negative. NEM and WEM prices come from different market designs: compare them side by side, never average across networks."
  - name: demand_mw
    type: DOUBLE
    is_calculated: false
    not_null: false
    properties:
      description: "Average demand in MW (a rate). For additive demand use demand_energy_mwh."
  - name: demand_energy_mwh
    type: DOUBLE
    is_calculated: false
    not_null: false
    properties:
      description: "Total energy demanded that day in MWh. The additive demand metric — sum this."
  - name: generation
    type: generation_daily
    relationship: market_generation
    properties:
      description: "Join handle to daily generation rows for the same region + day (one-to-many)."
primary_key: day
cached: false
properties:
  description: "Daily market outcomes by network and region (NEM + WEM). Grain: one row per region x day. Join generation_daily on region + day for fuel-mix-during-price-events questions."
