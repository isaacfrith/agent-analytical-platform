relationships:
  - name: order_items_orders
    models:
      - order_items
      - orders
    join_type: MANY_TO_ONE
    condition: order_items.order_id = orders.order_id
  - name: order_items_products
    models:
      - order_items
      - products
    join_type: MANY_TO_ONE
    condition: order_items.product_id = products.product_id
  - name: orders_customers
    models:
      - orders
      - customers
    join_type: MANY_TO_ONE
    condition: orders.customer_id = customers.customer_id
  - name: payments_orders
    models:
      - payments
      - orders
    join_type: ONE_TO_ONE
    condition: payments.order_id = orders.order_id
  - name: returned_orders_orders
    models:
      - returned_orders
      - orders
    join_type: MANY_TO_ONE
    condition: returned_orders.order_id = orders.order_id
  - name: generation_fueltech_groups
    models:
      - generation_daily
      - fueltech_groups
    join_type: MANY_TO_ONE
    condition: generation_daily.fueltech = fueltech_groups.fueltech
  - name: facilities_fueltech_groups
    models:
      - facilities
      - fueltech_groups
    join_type: MANY_TO_ONE
    condition: facilities.fueltech = fueltech_groups.fueltech
  - name: market_generation
    models:
      - generation_daily
      - market_daily
    join_type: MANY_TO_ONE
    condition: generation_daily.network_region = market_daily.network_region AND generation_daily.day = market_daily.day
