# Topics for the demo UI's "What's in the data" tab.
#
# Hand-written, with demos/energy-questions.yml. Everything else on the tab
# (columns, types, descriptions, joins, values, ranges) comes from the compiled
# MDL and the data at record time. scripts/demo_record.py fails if anything
# named here (cube, measure, model, column) is missing from the model.
#
# uses:     cubes (optionally narrowed to some measures) or models (with the
#           columns the topic reads). Columns a cube touches are derived from
#           its expressions, through the view, down to model columns.
#
# Example questions come from demos/energy-questions.yml (by topic id).

limits:
  - Daily figures only, no hourly or 5-minute data.
  - The last 90 days only, ending yesterday.
  - No Northern Territory, which has no public market data.
  - WA means the WEM, which covers the south-west only (not the Pilbara or remote WA).
  - Output is by region and fuel, not per power station. Stations have capacity only.
  - No forecasts, only what already happened.

topics:
  - id: prices
    name: Prices & demand
    summary: Daily wholesale spot prices and electricity demand, per region.
    uses:
      - cube: daily_price
    limits:
      - Prices are averaged, never summed. NEM and WA prices come from different market designs, so they are compared side by side, never averaged together.

  - id: generation
    name: Generation & fuel mix
    summary: How much electricity each fuel type produced, per region and day, and what it was worth at spot prices.
    uses:
      - cube: daily_generation
        measures: [energy_total, market_value_total]
    limits:
      - Battery rows go negative when charging. That is correct, not bad data.

  - id: emissions
    name: Emissions
    summary: Tonnes of CO2-equivalent emitted per region, fuel and day, plus each generating unit's emissions factor.
    uses:
      - cube: daily_generation
        measures: [emissions_total]
      - model: facilities
        columns: [facility_name, fueltech, network_region, emissions_factor_tco2e_mwh]

  - id: renewables
    name: Renewables
    summary: Renewable share of generation, using the governed definition (wind, solar, hydro and bioenergy; batteries excluded).
    uses:
      - cube: renewable_share
    limits:
      - Renewable follows the governed is_renewable flag. Storage (batteries, pumps) is never counted as generation.

  - id: stations
    name: Power stations & capacity
    summary: Every registered generating unit with its location, fuel, status and capacity in MW.
    uses:
      - model: facilities
        columns: [facility_code, facility_name, network, network_region, fueltech, status, capacity_registered_mw, capacity_maximum_mw, capacity_storage_mwh, latitude, longitude]
      - model: fueltech_groups
        columns: [fueltech, fueltech_group, is_renewable]
    limits:
      - Capacity is registered MW, not output. Commissioning units may run below full capacity.
